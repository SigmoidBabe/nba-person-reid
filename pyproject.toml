[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osnet-reid-trt"
version = "0.1.0"
description = "Batched OSNet person re-identification inference with TensorRT and OpenCV"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["osnet", "reid", "tensorrt", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.23",
    "opencv-python",
    "tensorrt>=8.6",
    "pycuda>=2022.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["osnet_reid_trt", "trt_handler"]
namespaces = false
